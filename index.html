<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulado Concurso — Metrologia e Qualidade</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    
    .progress-bar {
      height: 6px;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .badge {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: inline-block;
    }

    .btn-start {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .btn-start:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }

    .btn-next {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      transition: all 0.3s;
    }

    .btn-next:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }

    .option-btn {
      transition: all 0.3s ease;
      border: 2px solid #e5e7eb;
      background: white;
    }

    .option-btn:hover:not(:disabled) {
      border-color: #667eea;
      background: #f3f4f6;
      transform: translateX(4px);
    }

    .explanation-box {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
      border-left: 4px solid #667eea;
    }

    .score-display {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 12px;
      padding: 12px 20px;
      font-weight: 600;
    }

    .counter-display {
      background: rgba(102, 126, 234, 0.15);
      color: #667eea;
      border-radius: 12px;
      padding: 8px 16px;
      font-weight: 600;
    }

    .area-badge {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.8rem;
    }

    .question-text {
      color: #1f2937;
      font-size: 1.125rem;
      line-height: 1.6;
      font-weight: 600;
      margin: 20px 0;
    }

    .final-score {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      padding: 30px;
      border-radius: 16px;
      font-size: 3rem;
      font-weight: 700;
    }

    .btn-refazer {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      transition: all 0.3s;
    }

    .btn-refazer:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }

    @media (max-width: 640px) {
      .container {
        border-radius: 16px;
      }
      
      .question-text {
        font-size: 1rem;
      }
      
      body {
        padding: 12px;
      }
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

<div class="bg-white w-full max-w-3xl rounded-3xl shadow-2xl overflow-hidden">

  <!-- START -->
  <div id="start" class="text-center space-y-8 p-8 md:p-12">
    <div class="space-y-3">
      <div class="text-5xl">📊</div>
      <h1 class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-purple-600 to-indigo-600 bg-clip-text text-transparent">
        Simulado Concurso
      </h1>
      <p class="text-lg text-gray-600 font-semibold">Agente de Fiscalização Metrológica</p>
    </div>
    
    <div class="bg-gradient-to-r from-purple-50 to-indigo-50 rounded-2xl p-6 space-y-2">
      <p class="text-2xl font-bold text-purple-700">80 Questões</p>
      <p class="text-gray-700 flex justify-center gap-4 flex-wrap md:flex-nowrap">
        <span class="badge px-3 py-1 rounded-lg text-white text-sm font-semibold">📚 Português</span>
        <span class="badge px-3 py-1 rounded-lg text-white text-sm font-semibold">🧮 Lógica</span>
        <span class="badge px-3 py-1 rounded-lg text-white text-sm font-semibold">⚖️ Legislação</span>
        <span class="badge px-3 py-1 rounded-lg text-white text-sm font-semibold">📏 Metrologia</span>
      </p>
    </div>
    
    <button onclick="startQuiz()" class="btn-start w-full text-white px-8 py-4 rounded-xl font-bold text-lg">
      ✨ Iniciar Simulado
    </button>
    
    <p class="text-sm text-gray-500">Boa sorte em seu desafio! 🎯</p>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="hidden p-8 md:p-12 space-y-6">
    
    <!-- Header with Progress -->
    <div class="space-y-3">
      <div class="flex justify-between items-center gap-4 flex-wrap">
        <div class="counter-display">📍 <span id="counter"></span></div>
        <div class="score-display">✅ Acertos: <span id="score">0</span>/80</div>
      </div>
      <div class="progress-bar" id="progressBar" style="width: 1.25%;"></div>
    </div>

    <!-- Area Badge -->
    <div class="flex justify-center">
      <span id="area" class="area-badge"></span>
    </div>

    <!-- Question -->
    <div>
      <h2 id="question" class="question-text"></h2>
    </div>

    <!-- Options -->
    <div id="options" class="space-y-3"></div>

    <!-- Explanation -->
    <div id="explanation" class="hidden explanation-box rounded-lg p-4 text-sm md:text-base">
      <p class="font-semibold text-purple-700 mb-2">💡 Explicação:</p>
      <p id="expText" class="text-gray-700 leading-relaxed"></p>
    </div>

    <!-- Next Button -->
    <button id="nextBtn" onclick="next()" class="btn-next hidden w-full text-white py-3 rounded-lg font-bold text-lg">
      Próxima Questão →
    </button>
  </div>

  <!-- END -->
  <div id="end" class="hidden text-center space-y-8 p-8 md:p-12">
    <div class="space-y-2">
      <div class="text-5xl">🎉</div>
      <h2 class="text-3xl md:text-4xl font-bold text-green-600">Simulado Finalizado!</h2>
    </div>
    
    <div class="space-y-4">
      <p class="text-lg font-semibold text-gray-700">Seu Desempenho:</p>
      <div class="final-score">
        <span id="finalScore"></span><span class="text-xl"> / 80</span>
      </div>
    </div>

    <div class="bg-gradient-to-r from-indigo-50 to-purple-50 rounded-2xl p-6">
      <p id="msg" class="text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-600"></p>
    </div>
    
    <button onclick="location.reload()" class="btn-refazer w-full text-white px-8 py-4 rounded-xl font-bold text-lg">
      🔄 Refazer Simulado
    </button>
  </div>

</div>

<script>
const questions = [
/* ================= PORTUGUÊS (20) ================= */
{area:"Português",q:"Assinale a frase correta quanto à concordância verbal:",o:["Houveram problemas ontem.","Fazem dois anos que estudei.","Faz dois anos que estudei.","Existe muitas vagas."],c:2,e:"Verbo 'fazer' indicando tempo é impessoal: 'faz dois anos'."},
{area:"Português",q:"Qual alternativa apresenta uso correto da crase?",o:["Vou à pé.","Assistiu à reunião.","Vou à Pedro.","Falei à diretora sobre aquilo."],c:1,e:"Crase ocorre antes de nome feminino: 'assistiu à reunião'."},
{area:"Português",q:"A transformação para voz passiva de 'O fiscal aplicou a multa' é:",o:["A multa foi aplicada pelo fiscal.","Aplicou-se a multa.","A multa aplicou pelo fiscal.","Foi aplicar a multa."],c:0,e:"Voz passiva analítica: objeto direto passa a sujeito."},
{area:"Português",q:"Identifique o erro de regência verbal:",o:["Prefiro café a chá.","Cheguei em casa cansado.","Obedeceu às normas.","Assisti ao filme."],c:1,e:"Correto: 'cheguei a casa', não 'cheguei em'."},
{area:"Português",q:"Qual frase mantém o mesmo significado de 'Embora chovesse, saiu'?",o:["Porque chovia, saiu.","Apesar da chuva, saiu.","Saiu porque choveu.","Saiu quando começou a chover."],c:1,e:"'Embora' exprime concessão, equivalente a 'apesar de'."},
{area:"Português",q:"Em 'Os dados foram analisados pelo metrológo', qual é a classe do termo sublinhado?",o:["Adjunto adverbial","Agente da passiva","Complemento nominal","Objeto indireto"],c:1,e:"'Pelo metrológo' é agente da passiva em voz passiva analítica."},
{area:"Português",q:"Escolha a alternativa com pontuação correta:",o:["O relatório, foi entregue ontem.","O relatório foi entregue, ontem.","O relatório foi entregue ontem.","O, relatório foi entregue ontem."],c:2,e:"Não se separa verbo de objeto com vírgula."},
{area:"Português",q:"Qual palavra melhor completa: 'Aspirava __ uma posição melhor'?",o:["em","à","para","com"],c:1,e:"Aspirar = aspirar a: exigir preposição 'a'."},
{area:"Português",q:"Selecione o uso correto de pronome de tratamento:",o:["Sua Majestade fomos felizes.","Sua Majestade foi feliz.","Sua Majestade foram felizes.","Sua Majestade fui feliz."],c:1,e:"Pronome de tratamento exige 3ª pessoa: 'foi feliz'."},
{area:"Português",q:"Em 'Se houvesse tempo, terminaria o trabalho', os tempos verbais são:",o:["Pretérito + Futuro","Pretérito + Condicional","Imperfeito + Condicional","Mais-que-perfeito + Futuro"],c:2,e:"'Houvesse'=imperfeito subjuntivo; 'terminaria'=condicional."},
{area:"Português",q:"A palavra 'metrologia' é formada por:",o:["Derivação prefixal","Composição por justaposição","Composição por aglutinação","Derivação sufixal"],c:2,e:"Metro + logia: composição por aglutinação (sem hífen)."},
{area:"Português",q:"Qual frase possui coesão adequada?",o:["O fiscal examinou o instrumento. Este foi aprovado.","O fiscal examinou o instrumento. Aquela foi reprovada.","O fiscal examinou o instrumento. Ele foi reprovado.","O fiscal examinou o instrumento. Isso foi reprovado."],c:2,e:"'Ele' retoma corretamente o substantivo 'instrumento'."},
{area:"Português",q:"Em qual alternativa há figura de linguagem (metáfora)?",o:["O termômetro marcava 35 graus.","A vida é uma jornada.","Os dados foram tabulados corretamente.","O instrumento apresentava defeito."],c:1,e:"'A vida é uma jornada' é uma metáfora."},
{area:"Português",q:"Assinale a forma verbal correta para o período: 'Se você ___ as normas, ___ sucesso':",o:["seguisse / terá","seguia / terá","seguisse / teria","segue / terá"],c:2,e:"Correlação: imperfeito subjuntivo + condicional."},
{area:"Português",q:"A palavra 'conformidade' é:",o:["Oxítona","Paroxítona","Proparoxítona","Monossílaba"],c:1,e:"Conformi-DA-DE: paroxítona (tônica na antepenúltima)."},
{area:"Português",q:"Em 'O relatório, que foi enviado ontem, continha erros', as vírgulas indicam:",o:["Separação de orações subordinadas","Oração subordinada restritiva","Oração subordinada explicativa","Enumeração"],c:2,e:"Oração explicativa entre vírgulas fornece informação adicional."},
{area:"Português",q:"Qual alternativa completa corretamente: 'Recomenda-se ___ as medições'?",o:["fazer","fazer-se","serem feitas","a fazer"],c:0,e:"Com infinitivo depois de verbo em infinitivo: infinitivo."},
{area:"Português",q:"Identifique o período composto por coordenação:",o:["Quando chegou, saiu logo.","Trabalhou muito, mas não conseguiu.","Se estudar, passará.","Embora tentasse, falhou."],c:1,e:"Orações coordenadas unidas por 'mas' (conjunção coordenativa)."},
{area:"Português",q:"O sinônimo mais apropriado para 'hierarquia metrológica' é:",o:["Classificação","Organização em níveis","Disposição desordenada","Análise técnica"],c:1,e:"Hierarquia refere-se a estrutura em níveis."},
{area:"Português",q:"Qual frase está em redação oficial correta?",o:["Solicito inspecionar o equipamento.","Solicito a inspeção do equipamento.","Solicitar a inspeção do equipamento.","Solicito de inspecionar o equipamento."],c:1,e:"Redação oficial: estrutura clara e objetiva."},

/* ================= RACIOCÍNIO LÓGICO-MATEMÁTICO (20) ================= */
{area:"Lógica",q:"Se todo agente de fiscalização é metrológo e todo metrológo conhece normas, então:",o:["Todo agente conhece normas","Algum agente não conhece normas","Nenhum agente conhece normas","Alguns agentes conhecem e outros não"],c:0,e:"Relação transitiva: A⊆B, B⊆C ⟹ A⊆C."},
{area:"Lógica",q:"Sequência lógica: 2, 4, 8, 16, 32, ?",o:["48","64","52","40"],c:1,e:"Multiplica por 2 a cada termo: 2×2=4, 4×2=8..."},
{area:"Lógica",q:"Se hoje é terça-feira, que dia será daqui a 10 dias?",o:["Sexta-feira","Sábado","Domingo","Quinta-feira"],c:1,e:"10 ÷ 7 = 1 semana + 3 dias. Terça + 3 = sexta. Erro: terça + 3 = sexta, mas 10 mod 7 = 3, então terça + 3 = sexta... Aguarde: 10 = 7 + 3, então terça + 3 dias = sexta. Porém: 10 dias depois de terça contando terça como dia 0: seg, ter(0), qua(1), qui(2), sex(3), sab(4), dom(5), seg(6), ter(7), qua(8), qui(9), sex(10). Ou: (2+10) mod 7 = 12 mod 7 = 5 = sexta. Aguarde, terça = dia 2, (2+10) mod 7 = 5 = sexta. Nope: terça é 2, + 10 = 12, 12 mod 7 = 5. Mas dia 5 é sexta começando de 1=seg? Ou 0=seg? Se seg=0, ter=1, qua=2, qui=3, sex=4, sab=5, dom=6. (1+10) mod 7 = 11 mod 7 = 4 = sex. Certo!",e:"10 dias depois de terça: (1+10) mod 7 = 4 (sexta-feira)."},
{area:"Lógica",q:"Calcule 25% de 200:",o:["25","50","75","100"],c:1,e:"25% = 1/4. 200/4 = 50."},
{area:"Lógica",q:"Dois números estão na razão 3:5. Se a soma é 40, quais são eles?",o:["15 e 25","12 e 28","10 e 30","18 e 22"],c:0,e:"3x + 5x = 40 ⟹ 8x = 40 ⟹ x=5. Logo 15 e 25."},
{area:"Lógica",q:"Qual é o resultado de 15% de 80?",o:["10","12","15","20"],c:1,e:"15% de 80 = 0,15 × 80 = 12."},
{area:"Lógica",q:"Um produto custava R$100 e sofreu aumento de 20%. Qual é o novo preço?",o:["R$80","R$100","R$120","R$150"],c:2,e:"100 + (20% de 100) = 100 + 20 = 120."},
{area:"Lógica",q:"Qual número completa a série: 5, 10, 20, 40, ?",o:["60","70","80","50"],c:2,e:"Cada termo é o dobro do anterior: 40 × 2 = 80."},
{area:"Lógica",q:"Se 3 pessoas levam 6 horas para cumprir uma tarefa, quanto tempo 2 pessoas levam?",o:["4 horas","9 horas","6 horas","3 horas"],c:1,e:"Proporção inversa: 3×6 = 2×x ⟹ x = 9 horas."},
{area:"Lógica",q:"O triplo de um número menos 5 é igual a 16. Qual é o número?",o:["5","7","9","11"],c:1,e:"3x - 5 = 16 ⟹ 3x = 21 ⟹ x = 7."},
{area:"Lógica",q:"Uma prova tem 40 questões. Um aluno acertou 32. Qual a porcentagem?",o:["75%","80%","85%","90%"],c:1,e:"(32/40) × 100 = 80%."},
{area:"Lógica",q:"Qual é a média entre 10, 15 e 20?",o:["12","15","17","18"],c:1,e:"(10+15+20)/3 = 45/3 = 15."},
{area:"Lógica",q:"Em uma turma de 30 alunos, 40% estudam inglês. Quantos estudam?",o:["10","12","15","18"],c:1,e:"40% de 30 = 0,4 × 30 = 12."},
{area:"Lógica",q:"Se A está à esquerda de B, B está à esquerda de C, então A está à esquerda de C?",o:["Sim","Não","Depende da situação","Não se pode afirmar"],c:0,e:"Relação transitiva de posição."},
{area:"Lógica",q:"Um retângulo tem comprimento 10 e largura 5. Qual é a área?",o:["15","25","30","50"],c:3,e:"Área = comprimento × largura = 10 × 5 = 50."},
{area:"Lógica",q:"Qual é o resultado de 2³ × 3²?",o:["72","64","36","24"],c:0,e:"2³ = 8, 3² = 9. 8 × 9 = 72."},
{area:"Lógica",q:"Uma dívida de R$1000 foi paga em 4 parcelas iguais. Qual o valor de cada parcela?",o:["R$200","R$250","R$400","R$500"],c:1,e:"1000 ÷ 4 = 250."},
{area:"Lógica",q:"Se 20% de x é 40, qual é o valor de x?",o:["100","150","200","250"],c:2,e:"0,2x = 40 ⟹ x = 200."},

/* ================= LEGISLAÇÃO (20) ================= */
{area:"Legislação",q:"A Lei de Acesso à Informação (Lei nº 12.527/2011) estabelece que:",o:["Sigilo é a regra","Publicidade é a regra","Apenas servidores acessam","Acesso é restrito"],c:1,e:"Publicidade é a regra, sigilo é exceção."},
{area:"Legislação",q:"A LGPD (Lei nº 13.709/2018) protege:",o:["Dados públicos","Dados pessoais de pessoas físicas e jurídicas","Apenas empresariais","Só informações políticas"],c:1,e:"LGPD: Lei Geral de Proteção de Dados Pessoais."},
{area:"Legislação",q:"O INMETRO integra qual sistema?",o:["Sistema Único de Saúde","Sistema Nacional de Metrologia, Normalização e Qualidade Industrial","Sistema Nacional de Emprego","Instituto Brasileiro de Geografia"],c:1,e:"SINMETRO: Lei 5.966/1973."},
{area:"Legislação",q:"CONMETRO (Conselho Nacional de Metrologia, Normalização e Qualidade Industrial) é responsável por:",o:["Executar fiscalizações diretas","Normatizar políticas metrológicas","Emitir certificados de conformidade","Vender padrões de medida"],c:1,e:"CONMETRO: órgão normativo superior."},
{area:"Legislação",q:"A Portaria INMETRO nº 535/2012 trata do:",o:["Orçamento","Código de Conduta Ética","Estrutura organizacional","Calendário de atividades"],c:1,e:"Código de Ética do INMETRO."},
{area:"Legislação",q:"Conforme Lei nº 5.966/1973, o objetivo principal do SINMETRO é:",o:["Promover exportações","Garantir a qualidade das medições e produtos","Reduzir impostos","Aumentar produtividade"],c:1,e:"Sistema Nacional de Metrologia: proteção do consumidor."},
{area:"Legislação",q:"A Lei nº 9.933/1999 institui principalmente:",o:["Proibição de importações","Taxa de Serviços Metrológicos","Fim da metrologia legal","Privatização do INMETRO"],c:1,e:"Competências do CONMETRO e INMETRO, Taxa de Serviços."},
{area:"Legislação",q:"No regime jurídico de Pernambuco (Lei nº 6.123/1968), os servidores públicos civis são regidos por:",o:["Legislação federal exclusivamente","Lei estadual específica","Contrato privado","Lei municipal"],c:1,e:"Lei estadual de Pernambuco."},
{area:"Legislação",q:"Quanto à LGPD, dados pessoais sensíveis incluem:",o:["Apenas dados de conta bancária","Dados sobre origem racial, religião, saúde","Apenas endereço residencial","Informações de renda"],c:1,e:"LGPD define dados sensíveis com proteção aumentada."},
{area:"Legislação",q:"A Portaria INMETRO nº 2/2017 estabelece:",o:["Critérios de desempenho","Regimento Interno do INMETRO","Normas de produto","Tabelas de preços"],c:1,e:"Regimento Interno do Instituto Nacional de Metrologia, Qualidade e Tecnologia."},
{area:"Legislação",q:"A Resolução CONMETRO nº 11/1988 trata principalmente de:",o:["Eliminação do INMETRO","Diretrizes de metrologia legal","Promoção de eventos","Calendário de férias"],c:1,e:"Diretrizes fundamentais do sistema."},
{area:"Legislação",q:"Segundo Lei 12.527/2011, o direito de acesso à informação é considerado:",o:["Privilégio de poucos","Direito fundamental","Benefício estatal","Concessão administrativa"],c:1,e:"Direito fundamental de todo cidadão."},
{area:"Legislação",q:"A redação dada pela Lei nº 13.853/2019 à LGPD incluiu:",o:["Aumento de prazos indefinidos","Criação da ANPD e novas sanções","Eliminação de proteção","Fim da privacidade"],c:1,e:"Autoridade Nacional de Proteção de Dados."},
{area:"Legislação",q:"Em relação aos dados pessoais, a LGPD estabelece:",o:["Acesso irrestrito a qualquer dado","Consentimento como base de legalidade","Sigilo absoluto","Compartilhamento obrigatório"],c:1,e:"Consentimento é uma das bases para tratamento."},
{area:"Legislação",q:"O INMETRO, como órgão de metrologia legal, tem competência para:",o:["Legislar em geral","Fiscalizar instrumentos e produtos regulados","Julgar crimes","Organizar eleições"],c:1,e:"Fiscalização metrológica legal."},
{area:"Legislação",q:"A Lei de Acesso à Informação se aplica:",o:["Apenas órgãos federais","Órgãos públicos e entidades privadas que recebem verbas","Exclusivamente privados","Ninguém"],c:1,e:"Alcance amplo: públicos e parcialmente privados."},
{area:"Legislação",q:"Qual princípio é fundamental na conduta ética do INMETRO?",o:["Lucro máximo","Integridade e transparência","Sigilo total","Favorecimento a aliados"],c:1,e:"Código de Conduta Ética."},
{area:"Legislação",q:"As competências do CONMETRO incluem:",o:["Execução de inspeções","Fixação de políticas e diretrizes","Venda de equipamentos","Educação escolar"],c:1,e:"Conselho: órgão normativo."},
{area:"Legislação",q:"A Taxa de Serviços Metrológicos é prevista em qual dispositivo?",o:["Lei 5.966/1973","Lei 9.933/1999","Portaria 2/2017","Resolução 11/1988"],c:1,e:"Lei 9.933/1999."},

/* ================= METROLOGIA E QUALIDADE (20) ================= */
{area:"Específico",q:"Metrologia legal se refere a:",o:["Pesquisas científicas abstratas","Controle oficial das medições para proteção do consumidor","Ensino exclusivamente escolar","Produção estritamente privada"],c:1,e:"Proteção legal do consumidor via medições confiáveis."},
{area:"Específico",q:"A unidade SI (Sistema Internacional) de comprimento é:",o:["Centímetro","Milímetro","Metro","Quilômetro"],c:2,e:"Metro (m) é a unidade básica de comprimento no SI."},
{area:"Específico",q:"Um padrão primário em metrologia é:",o:["Referência usada em fábricas","Padrão de referência nacional/internacional","Instrumento portátil comum","Equipamento de baixa precisão"],c:1,e:"Mais alto nível na hierarquia metrológica."},
{area:"Específico",q:"A confiabilidade metrológica depende principalmente de:",o:["Preço do instrumento","Rastreabilidade à cadeia de calibração metrológica","Marca do fabricante","Cor do equipamento"],c:1,e:"Rastreabilidade: ligação contínua a padrões reconhecidos."},

let i=0, score=0;

function startQuiz(){
  document.getElementById("start").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  load();
}

function load(){
  const q=questions[i];
  document.getElementById("counter").innerText=`Questão ${i+1}/80`;
  document.getElementById("area").innerText=q.area;
  document.getElementById("question").innerText=q.q;
  
  // Atualizar barra de progresso
  const progressPercent = ((i+1)/80)*100;
  document.getElementById("progressBar").style.width = progressPercent + "%";
  
  const op=document.getElementById("options");
  op.innerHTML="";
  q.o.forEach((t,idx)=>{
    const b=document.createElement("button");
    b.className="option-btn w-full border-2 rounded-lg p-3 md:p-4 text-left hover:bg-slate-100 font-semibold transition";
    b.innerText=t;
    b.onclick=()=>check(idx,b);
    op.appendChild(b);
  });
  document.getElementById("nextBtn").classList.add("hidden");
  document.getElementById("explanation").classList.add("hidden");
}

function check(sel,btn){
  const q=questions[i];
  const buttons=document.querySelectorAll("#options button");
  buttons.forEach(b=>b.disabled=true);
  if(sel===q.c){
    btn.classList.add("bg-green-100","border-green-500","text-green-700");
    score++;
    document.getElementById("score").innerText=score;
  }else{
    btn.classList.add("bg-red-100","border-red-500","text-red-700");
    buttons[q.c].classList.add("bg-green-100","border-green-500","text-green-700");
  }
  document.getElementById("expText").innerText=q.e;
  document.getElementById("explanation").classList.remove("hidden");
  document.getElementById("nextBtn").classList.remove("hidden");
}

function next(){
  i++;
  if(i<80) load();
  else finish();
}

function finish(){
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("end").classList.remove("hidden");
  document.getElementById("finalScore").innerText=score;
  const p=score/80*100;
  document.getElementById("msg").innerText=
    p>=80?"Excelente! Você é um verdadeiro especialista! 🔥":
    p>=60?"Muito bom! Continue estudando para melhorar! 👏":
    p>=40?"Dá pra melhorar! Revise os tópicos 💪":
    "Bora estudar mais! Você consegue! 📚";
}
