<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>App Simulado - Didática Geral</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Tema Moderno Mobile-First */
    body {
      background: linear-gradient(135deg, #0ea5e9 0%, #10b981 100%);
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overscroll-behavior-y: none; 
    }
    
    .app-container {
      background: #ffffff;
      min-height: 95vh;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    .progress-bar-container {
      background: #e2e8f0;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #0ea5e9 0%, #10b981 100%);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .badge {
      background: linear-gradient(135deg, #0ea5e9 0%, #10b981 100%);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9 0%, #10b981 100%);
      transition: all 0.2s ease;
    }
    .btn-primary:active {
      transform: scale(0.96); 
    }

    .option-btn {
      transition: all 0.2s ease;
      border: 2px solid #e5e7eb;
      background: #ffffff;
      min-height: 60px; 
    }
    .option-btn:active:not(:disabled) {
      transform: scale(0.98);
      background: #f8fafc;
    }
    .option-btn.selected-correct {
      background: #d1fae5;
      border-color: #10b981;
      color: #065f46;
    }
    .option-btn.selected-wrong {
      background: #fee2e2;
      border-color: #ef4444;
      color: #991b1b;
    }

    .explanation-box {
      animation: slideDown 0.3s ease-out;
      border-left-width: 5px;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .score-badge {
      background: rgba(14, 165, 233, 0.1);
      color: #0369a1;
    }

    @media (min-width: 768px) {
      .app-container {
        min-height: auto;
        border-radius: 24px;
        margin-top: 2rem;
        margin-bottom: 2rem;
      }
    }
  </style>
</head>

<body class="flex items-center justify-center p-2 md:p-6">

<div class="app-container w-full max-w-2xl rounded-2xl flex flex-col relative overflow-hidden">

  <div id="start" class="flex flex-col h-full flex-grow justify-center text-center p-6 md:p-10 space-y-8">
    <div class="space-y-4">
      <div class="text-6xl animate-bounce">📘</div>
      <h1 class="text-3xl md:text-4xl font-extrabold bg-gradient-to-r from-sky-500 to-emerald-500 bg-clip-text text-transparent leading-tight">
        Simulado Didática
      </h1>
      <p class="text-base text-gray-500 font-medium">Formação Docente & Prática Educativa</p>
    </div>
    
    <div class="bg-slate-50 border border-slate-100 rounded-2xl p-5 space-y-3 shadow-sm">
      <p class="text-3xl font-black text-slate-800">40 Questões</p>
      <div class="flex flex-wrap justify-center gap-2 mt-2">
        <span class="badge px-3 py-1.5 rounded-full text-white text-xs font-bold shadow-sm">📚 Conceitos Básicos</span>
        <span class="badge px-3 py-1.5 rounded-full text-white text-xs font-bold shadow-sm">🎯 Planejamento</span>
        <span class="badge px-3 py-1.5 rounded-full text-white text-xs font-bold shadow-sm">🏫 A Escola</span>
      </div>
    </div>
    
    <button onclick="startQuiz()" class="btn-primary w-full text-white px-6 py-4 rounded-xl font-bold text-lg shadow-lg shadow-emerald-500/30">
      🚀 Começar Agora
    </button>
  </div>

  <div id="quiz" class="hidden flex-col h-full p-5 md:p-8 space-y-6 overflow-y-auto pb-24">
    
    <div class="sticky top-0 bg-white/95 backdrop-blur pt-2 pb-4 z-10 space-y-4">
      <div class="flex justify-between items-center">
        <div class="text-sm font-bold text-slate-500 bg-slate-100 px-3 py-1 rounded-lg">
          <span id="counter">1/40</span>
        </div>
        <div class="score-badge px-3 py-1 rounded-lg text-sm font-bold flex items-center gap-1">
          <span>⭐</span> <span id="score">0</span>
        </div>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar" style="width: 2.5%;"></div>
      </div>
      <div class="inline-block px-3 py-1 bg-sky-100 text-sky-700 rounded-full text-xs font-bold" id="area">
        Tema
      </div>
    </div>

    <div>
      <h2 id="question" class="text-lg md:text-xl text-slate-800 font-bold leading-snug"></h2>
    </div>

    <div id="options" class="flex flex-col space-y-3"></div>

    <div id="explanation" class="hidden explanation-box rounded-xl p-4 mt-4">
      <p id="expTitle" class=""></p>
      <div id="expText" class="text-sm leading-relaxed"></div>
    </div>

  </div>

  <div id="action-footer" class="hidden absolute bottom-0 left-0 w-full p-4 bg-white border-t border-slate-100 z-20">
    <button id="nextBtn" onclick="next()" class="btn-primary w-full text-white py-4 rounded-xl font-bold text-lg shadow-lg">
      Avançar ➔
    </button>
  </div>

  <div id="end" class="hidden flex-col h-full justify-center text-center p-6 md:p-10 space-y-8">
    <div class="space-y-3">
      <div class="text-7xl">🏆</div>
      <h2 class="text-3xl font-black text-slate-800">Fim de Jogo!</h2>
    </div>
    
    <div class="bg-slate-50 rounded-3xl p-8 border border-slate-100 shadow-inner">
      <p class="text-sm text-slate-500 font-bold uppercase tracking-wider mb-2">Acertos</p>
      <div class="text-6xl font-black text-emerald-500">
        <span id="finalScore"></span><span class="text-3xl text-slate-300">/40</span>
      </div>
    </div>

    <p id="msg" class="text-lg font-bold text-slate-700"></p>
    
    <button onclick="location.reload()" class="w-full bg-slate-800 text-white active:scale-95 transition-transform px-6 py-4 rounded-xl font-bold text-lg shadow-lg">
      🔄 Tentar Novamente
    </button>
  </div>

</div>

<script>
const TOTAL_QUESTIONS = 40;

const questions = [
  // 1-10: Conceitos Gerais
  {area:"Conceitos", q:"O que é a Didática no contexto educacional?", o:["O estudo da administração e legislação das escolas.","O ramo da Pedagogia que tem como objetivo dirigir tecnicamente o ensino rumo à aprendizagem.","A ciência que estuda exclusivamente a história da educação.","Uma técnica focada apenas na disciplina física dos alunos na sala de aula."], c:1, e:"A didática é a parte da pedagogia que tem como objeto de estudo o ensino em sua relação com a aprendizagem, dirigindo-o tecnicamente."},
  {area:"Conceitos", q:"O que significa estudar didática?", o:["Apenas acumular conhecimentos sobre técnicas de ensino.","Memorizar teorias pedagógicas antigas sem aplicação prática.","Desenvolver a capacidade de questionamento, experimentação e reflexão sobre os métodos e procedimentos de ensino.","Criar regras rígidas que não podem ser alteradas durante as aulas."], c:2, e:"Estudar didática vai além do acúmulo de técnicas; significa desenvolver a capacidade de questionar, experimentar e refletir."},
  {area:"Conceitos", q:"Como o termo 'Educação' é compreendido de modo geral?", o:["Como um processo universal que nunca muda com o tempo.","Como uma manifestação da cultura que depende do contexto histórico e social em que está inserido.","Estritamente como a transmissão de conteúdos dentro de uma sala de aula.","Como uma atividade exclusiva das sociedades modernas e industrializadas."], c:1, e:"A educação é uma manifestação cultural e, por isso, seus fins variam de acordo com a época, a sociedade, o tempo e o espaço."},
  {area:"Conceitos", q:"O que define a Educação em seu sentido social?", o:["O desenvolvimento das aptidões de cada indivíduo isoladamente.","A ação das gerações anteriores sobre as mais jovens, orientando condutas e transmitindo valores.","O processo de aprendizagem motora sem influência externa.","A aquisição de conhecimentos puramente técnicos."], c:1, e:"No sentido social, a educação é a transmissão de conhecimentos, normas, crenças e costumes das gerações mais velhas para as mais jovens."},
  {area:"Conceitos", q:"Qual é o foco da Educação em seu sentido individual?", o:["A manutenção da subsistência do grupo.","O condicionamento do indivíduo para obedecer às regras.","O desenvolvimento das aptidões e capacidades de cada indivíduo, visando aprimorar sua personalidade.","A padronização do comportamento."], c:2, e:"Busca desenvolver as capacidades da pessoa para o aprimoramento de sua própria personalidade."},
  {area:"Conceitos", q:"Qual termo apresenta um conceito mais amplo e abrangente?", o:["Ensino.","Instrução.","Educação.","Didática."], c:2, e:"O termo 'Educação' apresenta um conceito extremamente amplo, sendo muito mais abrangente do que o termo 'ensino'."},
  {area:"Conceitos", q:"Como se processa a forma 'assistemática' de educação?", o:["Em escolas com currículos definidos pelo governo.","Pela experiência direta, participando das atividades dos adultos de forma não estruturada.","Através de instituições de instrução.","Exclusivamente através de cartilhas."], c:1, e:"Ocorre em sociedades mais simples, onde a aprendizagem se dá pela experiência direta com as atividades do grupo."},
  {area:"Instituição", q:"Em qual contexto surge a escola como instituição social?", o:["Na educação sistemática, para transmissão organizada de um vasto acervo cultural.","Na educação assistemática, para substituir a família.","Antes do desenvolvimento de qualquer acervo cultural.","Apenas nas sociedades nômades."], c:0, e:"A escola surge no contexto da educação sistemática, para garantir a transmissão organizada do patrimônio em sociedades complexas."},
  {area:"Conceitos", q:"O que é Pedagogia?", o:["A aplicação prática de provas e testes.","O estudo sistemático da educação, sendo a ciência e a arte da educação.","Uma vertente exclusiva da filosofia da mente.","O processo de aprendizagem puramente motora."], c:1, e:"A Pedagogia é o estudo sistemático, a ciência e a arte da educação, oferecendo espaço para a reflexão sobre a formação humana."},
  {area:"Papel do Professor", q:"No passado, como era caracterizada a figura do professor pela didática tradicional?", o:["Como um orientador que apenas estimulava o aluno.","Como o construtor conjunto do conhecimento.","Como a figura central, detentor do conhecimento a ser repassado.","Como um observador neutro."], c:2, e:"Antigamente, a didática era dominada pela figura central do professor como o detentor único do conhecimento."},
  
  // 11-20: Aprendizagem e Papéis
  {area:"Conceitos", q:"No contexto presente, qual é o princípio básico da didática?", o:["A passividade do aluno frente ao professor.","A atividade do discente, onde ensinar e aprender são faces de uma mesma moeda.","A exclusão do professor do processo educativo.","O uso de cartilhas de repetição."], c:1, e:"A didática moderna projeta a aprendizagem do aluno de forma ativa, considerando ensinar e aprender como partes do mesmo processo."},
  {area:"Conceitos", q:"O que é Ensino?", o:["Uma reflexão sem objetivo prático.","Uma ação deliberada e organizada pela qual o professor orienta a aprendizagem por métodos adequados.","O desenvolvimento espontâneo de aptidões motoras.","Um processo puramente assistemático."], c:1, e:"O ensino é o objeto principal da didática, definido como uma ação organizada em que o professor utiliza métodos para orientar a aprendizagem."},
  {area:"Aprendizagem", q:"A aprendizagem é definida apenas como a aquisição de informações?", o:["Sim, é o acúmulo de dados.","Não, as informações devem ser transformadas e ganhar caráter significativo para a vida.","Sim, desde que testadas em provas.","Não, refere-se unicamente ao físico."], c:1, e:"A aprendizagem é um processo complexo que visa transformar as informações, dando-lhes significado para a vida das pessoas."},
  {area:"Aprendizagem", q:"Qual tipo de aprendizagem abrange a aquisição de informações e conhecimentos teóricos?", o:["Aprendizagem motora.","Aprendizagem afetiva.","Aprendizagem emocional.","Aprendizagem cognitiva."], c:3, e:"A aprendizagem cognitiva é aquela que abrange diretamente a aquisição de informações e conhecimentos intelectuais."},
  {area:"Aprendizagem", q:"O que engloba a aprendizagem afetiva ou emocional?", o:["O domínio de habilidades gráficas.","A assimilação de regras matemáticas.","Os sentimentos e as emoções do indivíduo.","A repetição física de um movimento."], c:2, e:"A aprendizagem afetiva diz respeito ao desenvolvimento e compreensão dos sentimentos e emoções no processo educativo."},
  {area:"Papel do Aluno", q:"Qual é o papel do aluno no moderno processo de ensino-aprendizagem?", o:["Recipiente passivo de informações.","Objeto da educação sem voz ativa.","Ao mesmo tempo, objeto, sujeito e construtor do processo.","Detentor absoluto do conhecimento prévio."], c:2, e:"No processo atual, o aluno tem um papel ativo, sendo objeto, sujeito e construtor de sua própria aprendizagem."},
  {area:"Papel do Professor", q:"No processo de ensino-aprendizagem, qual o papel do professor?", o:["Repassador autoritário de conteúdo.","Estimulador, orientador e facilitador, que cria condições para o aluno aprender.","Único construtor do ensino.","Observador isento de planejamento."], c:1, e:"O professor atua como estimulador, orientador e facilitador, criando as condições necessárias para que o aluno construa conhecimento."},
  {area:"Conceitos", q:"Por que a Filosofia é importante para a Educação?", o:["Porque a educação se baseia em cálculos matemáticos.","Porque toda doutrina pedagógica fundamenta-se numa teoria filosófica e na concepção de homem e de vida.","Para substituir a sociologia.","Porque ensina apenas história grega."], c:1, e:"Os sistemas educacionais baseiam-se em concepções de homem; portanto, os aspectos filosóficos dão à educação o seu sentido."},
  {area:"Papel do Professor", q:"A formação profissional do professor abrange quais dimensões principais?", o:["Formação emocional e financeira.","Formação teórica e esportiva.","Formação teórico-científica e formação técnico-prática.","Formação assistemática e sistemática."], c:2, e:"A formação do docente divide-se em teórico-científica (disciplinas) e técnico-prática (didática e metodologias)."},
  {area:"Papel do Professor", q:"O que inclui a formação técnico-prática do professor?", o:["Filosofia e Sociologia da Educação.","A preparação específica para a docência (didática, metodologias e psicologia da educação).","O domínio exclusivo dos conteúdos disciplinares.","Estágio probatório sem estudo teórico."], c:1, e:"A dimensão técnico-prática visa a preparação direta para a docência, englobando didática, pesquisa e metodologias aplicadas."},
  
  // 21-30: Escola e Planejamento Básico
  {area:"Papel do Professor", q:"Qual é a finalidade principal do trabalho do professor após sua formação?", o:["Garantir a memorização de datas.","Preparar os alunos para se tornarem cidadãos ativos na sociedade, família e trabalho.","Fazer todos seguirem carreira acadêmica.","Preparar exclusivamente para o ENEM."], c:1, e:"O docente tem a enorme responsabilidade de preparar o aluno de forma integral para enfrentar a vida prática e a cidadania."},
  {area:"Instituição", q:"Como a sala de aula é estruturada no contexto de uma escola do tipo 'ativa'?", o:["Organização física estática em fileiras.","Aluno mantido passivo, apenas ouvindo.","Uso de técnicas onde os alunos fazem atividades diferentes, agrupando-se de forma diversa.","Mesas fixadas no chão sem mobilidade."], c:2, e:"Na escola ativa/democrática, promove-se a atuação do aluno através de agrupamentos variados e ambientes dinâmicos."},
  {area:"Planejamento", q:"O que é o 'Planejamento' no contexto da ação didática?", o:["O documento físico entregue ao coordenador.","O 'processo' mental contínuo que supõe análise, reflexão e previsão.","Sinônimo exato da folha de 'Plano'.","A improvisação antes de entrar na sala."], c:1, e:"O planejamento é o processo de reflexão e análise que ocorre ao longo do tempo, diferenciando-se do plano, que é o seu resultado."},
  {area:"Planejamento", q:"O que é o 'Plano' de ação didática?", o:["O processo abstrato de prever.","A improvisação de uma aula.","Um dos resultados possíveis e concretos do processo de planejamento (documento escrito).","O diário de faltas."], c:2, e:"O plano é o produto, o documento concreto gerado a partir do processo mental de planejamento."},
  {area:"Planejamento", q:"Por que planejar é extremamente importante na educação?", o:["Garante a improvisação das aulas.","Evita improvisação, prevê/supera dificuldades e ajuda a cumprir objetivos com eficiência.","É uma burocracia sem impacto na aprendizagem.","Substitui a avaliação final dos alunos."], c:1, e:"O planejamento impede o improviso constante, antecipa problemas e economiza tempo, garantindo eficácia."},
  {area:"Planejamento", q:"O que significa 'coerência e unidade' em um plano de ensino?", o:["Que pode ser interpretado de várias formas.","Que deve haver uma conexão lógica entre os objetivos traçados e os meios para alcançá-los.","Que o plano não sofre adaptação.","Que o assunto muda a cada hora."], c:1, e:"Refere-se à harmonia e conexão direta entre o que se deseja alcançar (objetivos) e como isso será feito (meios e atividades)."},
  {area:"Planejamento", q:"A característica de 'flexibilidade' de um plano indica que ele deve:", o:["Ser rigorosamente seguido sem falhas.","Ajustar-se às dificuldades apenas se sobrar tempo.","Possibilitar ajustes e adaptações a situações não previstas na sala de aula.","Permitir que o professor saia da sala."], c:2, e:"Um bom plano é flexível, sendo reajustado diante de imprevistos ou dinâmicas reais que surgem com os alunos."},
  {area:"Planejamento", q:"O que caracteriza a 'objetividade e funcionalidade' num planejamento?", o:["Vocabulário rebuscado.","Estruturação baseada em teorias puramente abstratas.","A adequação do plano à realidade, aos recursos, ao tempo e às características dos alunos.","Padronização com apostilas estatais."], c:2, e:"A objetividade faz com que o plano seja real, prático e aplicável ao contexto e aos limites materiais disponíveis."},
  {area:"Planejamento", q:"Para que o plano não seja passível de dupla interpretação, ele deve ter:", o:["Complexidade.","Muitas páginas.","Clareza e precisão na linguagem.","Flexibilidade total."], c:2, e:"A linguagem deve ser simples, exata e precisa, garantindo clareza para que qualquer um entenda as diretrizes propostas."},
  {area:"Tipos de Planejamento", q:"Em quais níveis ocorre o 'Planejamento do Sistema Educacional'?", o:["Só no município.","Somente dentro de cada escola.","Nacional, estadual e municipal.","Apenas na sala de aula."], c:2, e:"O planejamento sistêmico reflete a política macro de educação, ocorrendo nos níveis federal, estadual e municipal."},
  
  // 31-40: Níveis de Planejamento
  {area:"Tipos de Planejamento", q:"Como deve ser o caráter do 'Planejamento da Escola'?", o:["Autoritário (apenas gestão).","Participativo, envolvendo professores, pais, alunos e funcionários na tomada de decisões.","Exclusivo dos alunos.","Delegado à Secretaria de Educação."], c:1, e:"Este planejamento (base do PPP) deve ser democrático e ter a construção conjunta de toda a comunidade escolar."},
  {area:"Tipos de Planejamento", q:"O Planejamento de Currículo baseia-se em quê?", o:["Nas escolhas diárias dos estudantes.","Na previsão das disciplinas a partir das diretrizes fixadas pelos Conselhos de Educação (núcleo comum e diversificado).","Exclusivamente na intuição dos professores.","Apenas nos livros do MEC."], c:1, e:"O planejamento curricular estrutura os componentes ao longo do curso respeitando as diretrizes dos Conselhos de Educação."},
  {area:"Tipos de Planejamento", q:"O que é o 'Planejamento Didático ou de Ensino'?", o:["A organização administrativa da secretaria.","A especificação e operacionalização do plano curricular, prevendo as ações do professor e atividades discentes.","O conserto da estrutura física.","A criação do PPP da escola."], c:1, e:"Ele traduz o currículo em práticas reais, sendo a ponte onde o professor organiza suas aulas e métodos diretos com a turma."},
  {area:"Planejamento Didático", q:"No aspecto didático, antes de definir os objetivos, o professor deve primeiramente:", o:["Aplicar a prova final.","Escolher os vídeos da aula.","Analisar as características, necessidades, aspirações e possibilidades dos seus alunos.","Preencher o diário de classe."], c:2, e:"O ponto de partida do planejamento de ensino é diagnosticar e entender a realidade e as demandas do corpo discente."},
  {area:"Planejamento Didático", q:"Quais são os três tipos principais de planejamento didático ou de ensino?", o:["Plano financeiro, marketing e curso.","Plano estadual, municipal e escolar.","Plano de curso, plano de unidade e plano de aula.","Plano de carreira, bimestral e diário."], c:2, e:"O planejamento no nível do professor divide-se hierarquicamente na elaboração do Curso (ano), da Unidade (temas) e da Aula (dia)."},
  {area:"Planejamento Didático", q:"O que define o 'Plano de Curso'?", o:["A aula de 50 minutos.","O currículo do MEC.","A previsão geral dos conhecimentos e atividades de uma classe durante todo o período letivo (ano/semestre).","O grupo de disciplinas afins."], c:2, e:"É a visão panorâmica e ampla que engloba tudo que será desenvolvido na disciplina ao longo do período letivo inteiro."},
  {area:"Planejamento Didático", q:"O que caracteriza o 'Plano de Unidade'?", o:["O planejamento de uma excursão.","A reunião e especificação de várias aulas sobre assuntos/tópicos correlatos dentro do curso.","A reunião de planejamento dos professores.","O boletim escolar."], c:1, e:"O plano de unidade 'quebra' o grande plano de curso em blocos temáticos, agrupando aulas que possuem forte relação entre si."},
  {area:"Planejamento Didático", q:"Qual a definição correta para o 'Plano de Aula'?", o:["O estatuto do aluno.","O orçamento mensal da escola.","A sequência e detalhamento de tudo o que vai ser desenvolvido de forma específica em um dia letivo.","A ata de reunião de pais."], c:2, e:"É a camada micro do planejamento, focada na execução prática dos métodos, conteúdos e tempo daquele dia específico de aula."},
  {area:"Tipos de Planejamento", q:"No planejamento da escola, a elaboração conjunta frequentemente leva à construção de qual documento estratégico?", o:["O PEI (Plano Educacional Individualizado).","O PPP (Projeto Político-Pedagógico).","O Livro de Ponto.","A BNCC."], c:1, e:"A participação e reflexão da comunidade escolar resultam no Projeto Político-Pedagógico (PPP), que é a 'identidade' da escola."},
  {area:"Planejamento", q:"Segundo a citação de Robson Ribeiro dos Santos estudada no material, 'Planejar é...'", o:["'...ter clareza do próximo passo.'","'...construir a ponte entre a ideia e a realização.'","'...uma forma de nortear um trabalho.'","'...opcional para bons professores.'"], c:1, e:"A frase destaca o planejamento como o elemento de transição que permite materializar intenções e ideias abstratas em resultados práticos na educação."}
];

let currentIndex = 0;
let score = 0;

function startQuiz() {
  document.getElementById("start").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  document.getElementById("quiz").classList.add("flex");
  document.getElementById("action-footer").classList.remove("hidden");
  loadQuestion();
}

function loadQuestion() {
  const q = questions[currentIndex];
  
  document.getElementById("counter").innerText = `${currentIndex + 1}/${TOTAL_QUESTIONS}`;
  document.getElementById("area").innerText = q.area;
  document.getElementById("question").innerText = q.q;
  
  const progressPercent = ((currentIndex + 1) / TOTAL_QUESTIONS) * 100;
  document.getElementById("progressBar").style.width = progressPercent + "%";
  
  const optionsContainer = document.getElementById("options");
  optionsContainer.innerHTML = "";
  
  q.o.forEach((textoOpcao, idx) => {
    const btn = document.createElement("button");
    btn.className = "option-btn w-full rounded-xl p-4 text-left font-semibold text-slate-700 shadow-sm text-sm md:text-base";
    btn.innerText = textoOpcao;
    btn.onclick = () => checkAnswer(idx, btn);
    optionsContainer.appendChild(btn);
  });
  
  document.getElementById("action-footer").classList.add("hidden");
  document.getElementById("explanation").classList.add("hidden");
  
  document.getElementById("quiz").scrollTo({ top: 0, behavior: 'smooth' });
}

function checkAnswer(selectedIndex, clickedBtn) {
  const q = questions[currentIndex];
  const buttons = document.querySelectorAll("#options button");
  const expBox = document.getElementById("explanation");
  const expTitle = document.getElementById("expTitle");
  const expText = document.getElementById("expText");
  
  buttons.forEach(b => b.disabled = true);
  
  // LOGICA NOVA AQUI
  if (selectedIndex === q.c) {
    // Acertou
    clickedBtn.classList.add("selected-correct");
    score++;
    document.getElementById("score").innerText = score;
    
    expBox.className = "explanation-box rounded-xl p-4 mt-4 bg-emerald-50 border-emerald-500 text-emerald-900";
    expTitle.innerHTML = "<span>✅</span> Você acertou!";
    expTitle.className = "font-bold mb-3 flex items-center gap-2 text-lg text-emerald-800";
    
    expText.innerHTML = `<strong>Explicação:</strong> ${q.e}`;
    
  } else {
    // Errou
    clickedBtn.classList.add("selected-wrong");
    buttons[q.c].classList.add("selected-correct");
    
    expBox.className = "explanation-box rounded-xl p-4 mt-4 bg-red-50 border-red-500 text-red-900";
    expTitle.innerHTML = "<span>❌</span> Você errou!";
    expTitle.className = "font-bold mb-3 flex items-center gap-2 text-lg text-red-800";
    
    const textoCorreta = q.o[q.c];
    
    expText.innerHTML = `
      <div class="mb-3">
        A resposta correta era:<br>
        <strong class="text-red-800 text-base">"${textoCorreta}"</strong>
      </div>
      <div class="pt-3 border-t border-red-200">
        <strong>Por que?</strong> ${q.e}
      </div>
    `;
  }
  
  expBox.classList.remove("hidden");
  document.getElementById("action-footer").classList.remove("hidden");
  
  setTimeout(() => {
    document.getElementById("quiz").scrollTo({ 
      top: document.getElementById("quiz").scrollHeight, 
      behavior: 'smooth' 
    });
  }, 100);
}

function next() {
  currentIndex++;
  if (currentIndex < TOTAL_QUESTIONS) {
    loadQuestion();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("quiz").classList.remove("flex");
  document.getElementById("action-footer").classList.add("hidden");
  
  document.getElementById("end").classList.remove("hidden");
  document.getElementById("end").classList.add("flex");
  
  document.getElementById("finalScore").innerText = score;
  
  const percentual = (score / TOTAL_QUESTIONS) * 100;
  let mensagem = "";
  
  if (percentual >= 90) {
    mensagem = "Excelente! Você dominou a Didática! 🌟";
  } else if (percentual >= 70) {
    mensagem = "Muito bom! Seus conhecimentos pedagógicos estão ótimos! 👏";
  } else if (percentual >= 50) {
    mensagem = "Foi na média! Vale a pena revisar planejamento e metodologias. 📚";
  } else {
    mensagem = "Precisa praticar mais os fundamentos teóricos. Não desista! 💪";
  }
  
  document.getElementById("msg").innerText = mensagem;
}
</script>
